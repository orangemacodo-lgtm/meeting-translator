<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background (maskable safe zone: 80% center) -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Microphone -->
  <g transform="translate(256 256)">
    <!-- Mic body -->
    <rect x="-52" y="-130" width="104" height="180" rx="52" fill="url(#mic)"/>
    <!-- Mic stand arc -->
    <path d="M -110 0 A 110 110 0 0 0 110 0" stroke="#38bdf8" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- Mic stem -->
    <rect x="-8" y="100" width="16" height="48" rx="4" fill="#38bdf8"/>
    <!-- Mic base -->
    <rect x="-60" y="148" width="120" height="14" rx="7" fill="#38bdf8"/>
  </g>
  <!-- Translation arrows (top-right corner) -->
  <g transform="translate(380 132)" opacity="0.85">
    <circle cx="0" cy="0" r="44" fill="#818cf8"/>
    <text x="0" y="8" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="36" font-weight="700" fill="#0f172a">文A</text>
  </g>
</svg>
