<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="會議翻譯" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<title>語音翻譯會議紀錄</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #818cf8;
    --warn: #fbbf24;
    --danger: #f87171;
    --success: #4ade80;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* === Top bar === */
  header {
    padding: calc(12px + var(--safe-top)) 16px 12px;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    position: sticky; top: 0; z-index: 10;
  }
  h1 {
    margin: 0;
    font-size: 16px;
    display: flex; align-items: center; gap: 8px;
    flex: 1; min-width: 0;
  }
  h1 .title-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0;
    transition: background .2s;
  }
  .dot.live { background: var(--danger); animation: pulse 1.2s infinite; }
  .dot.paused { background: var(--warn); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(248,113,113,.5); }
    70% { box-shadow: 0 0 0 8px rgba(248,113,113,0); }
    100% { box-shadow: 0 0 0 0 rgba(248,113,113,0); }
  }

  .icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    width: 40px; height: 40px;
    border-radius: 10px;
    cursor: pointer; font-size: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .icon-btn:active { background: var(--panel-2); }

  /* === Settings panel (collapsible) === */
  .config {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    overflow: hidden;
    max-height: 0;
    transition: max-height .25s ease;
  }
  .config.open { max-height: 600px; }
  .config-inner {
    padding: 14px 16px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .field select, .field input {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 15px;
    width: 100%;
  }
  .targets {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .chip {
    padding: 8px 14px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    transition: all .1s;
  }
  .chip.active { background: var(--accent-2); color: #0f172a; border-color: var(--accent-2); font-weight: 600; }
  .chip:active { transform: scale(.96); }

  /* === Transcript area === */
  main {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 16px calc(120px + var(--safe-bottom));
  }
  .entry {
    margin-bottom: 12px;
    padding: 12px 14px;
    background: var(--panel);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
  }
  .entry .time {
    font-size: 11px; color: var(--muted); margin-bottom: 6px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }
  .entry .original {
    font-size: 16px; line-height: 1.55; margin-bottom: 8px;
    word-break: break-word;
  }
  .entry .translations {
    display: flex; flex-direction: column; gap: 4px;
    border-top: 1px dashed var(--border);
    padding-top: 8px; margin-top: 6px;
  }
  .entry .tr-line {
    font-size: 14px; color: var(--muted); line-height: 1.5;
    word-break: break-word;
  }
  .entry .tr-line .lang {
    display: inline-block; min-width: 36px;
    color: var(--accent-2); font-size: 11px;
    font-weight: 600; margin-right: 6px;
  }
  .interim {
    padding: 12px 14px; margin-bottom: 12px;
    background: rgba(56,189,248,.08);
    border-left: 3px solid var(--warn);
    border-radius: 10px;
    font-style: italic; color: var(--muted);
  }
  .empty {
    text-align: center; color: var(--muted);
    padding: 60px 20px;
  }
  .empty h2 { color: var(--text); font-size: 18px; margin-bottom: 10px; }
  .empty p { font-size: 14px; line-height: 1.6; }
  .empty .icon-big { font-size: 48px; margin-bottom: 16px; opacity: .6; }

  /* === Bottom action bar === */
  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 16px calc(12px + var(--safe-bottom));
    display: flex; gap: 8px;
    z-index: 10;
  }
  .btn {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px 12px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: all .15s;
  }
  .btn:disabled { opacity: 0.35; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn.primary { background: var(--accent); color: #0f172a; border-color: var(--accent); }
  .btn.warn { background: var(--warn); color: #0f172a; border-color: var(--warn); }
  .btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }

  /* === Notice / install banner === */
  .notice {
    background: #422006; color: #fde68a;
    padding: 10px 16px; font-size: 13px;
    border-bottom: 1px solid #78350f;
  }
  .install-banner {
    background: var(--panel-2); color: var(--text);
    padding: 12px 16px; font-size: 13px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .install-banner button {
    margin-left: auto;
    background: var(--accent); color: #0f172a;
    border: none; padding: 6px 12px; border-radius: 6px;
    font-weight: 600; cursor: pointer;
  }
  .install-banner .close { background: transparent; color: var(--muted); }
  .hide { display: none !important; }

  /* === Modal (export menu) === */
  .modal-back {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100;
  }
  .modal {
    background: var(--panel);
    width: 100%; max-width: 420px;
    border-radius: 16px 16px 0 0;
    padding: 16px 16px calc(16px + var(--safe-bottom));
    border-top: 1px solid var(--border);
  }
  .modal h3 { margin: 0 0 12px; font-size: 16px; }
  .modal .opt {
    display: block; width: 100%;
    padding: 14px; margin-bottom: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px;
    font-size: 15px; cursor: pointer; text-align: left;
  }

  /* === Tablet & desktop === */
  @media (min-width: 768px) {
    header { padding: 16px 24px; }
    h1 { font-size: 18px; }
    main { padding: 20px 24px calc(120px + var(--safe-bottom)); max-width: 900px; margin: 0 auto; width: 100%; }
    .config-inner { max-width: 900px; margin: 0 auto; width: 100%; flex-direction: row; flex-wrap: wrap; align-items: flex-end; }
    .field { flex: 1; min-width: 200px; }
    .field-targets { flex-basis: 100%; }
    .actionbar { padding: 14px 24px calc(14px + var(--safe-bottom)); }
    .actionbar-inner { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; width: 100%; }
  }
</style>
</head>
<body>

<header>
  <h1>
    <span id="statusDot" class="dot"></span>
    <span class="title-text">語音翻譯會議紀錄</span>
  </h1>
  <button id="btnSettings" class="icon-btn" aria-label="設定">⚙</button>
</header>

<div id="installBanner" class="install-banner hide">
  <span>📲 把這個工具加到主畫面，下次更快開啟</span>
  <button id="btnInstall">安裝</button>
  <button id="btnInstallClose" class="close">✕</button>
</div>

<div id="warnBox" class="notice hide"></div>

<section id="config" class="config open">
  <div class="config-inner">
    <div class="field">
      <label for="srcLang">語音輸入語言</label>
      <select id="srcLang">
        <option value="zh-TW">中文（繁體・台灣）</option>
        <option value="nan-TW">台語（閩南語・實驗性）</option>
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="zh-CN">中文（簡體）</option>
        <option value="ja-JP">日本語</option>
        <option value="ko-KR">한국어</option>
      </select>
    </div>
    <div class="field field-targets">
      <label>翻譯目標（可多選）</label>
      <div id="targetChips" class="targets">
        <span class="chip" data-code="zh-TW">繁中</span>
        <span class="chip" data-code="en">英文</span>
        <span class="chip" data-code="ja">日文</span>
        <span class="chip" data-code="ko">韓文</span>
        <span class="chip" data-code="zh-CN">簡中</span>
        <span class="chip" data-code="es">西文</span>
        <span class="chip" data-code="fr">法文</span>
        <span class="chip" data-code="de">德文</span>
      </div>
    </div>
    <div class="field">
      <label for="meetingTitle">會議標題</label>
      <input id="meetingTitle" type="text" placeholder="例：週會 2026-04-26" />
    </div>
  </div>
</section>

<main id="transcript">
  <div id="emptyState" class="empty">
    <div class="icon-big">🎤</div>
    <h2>準備好開始錄音了嗎？</h2>
    <p>點下方 <strong>開始錄音</strong>，系統會即時辨識你的語音並翻譯成你選擇的目標語言。</p>
    <p style="font-size:12px; margin-top: 20px;">建議使用 Chrome / Edge / Safari（iOS 14.5+）</p>
  </div>
</main>

<div class="actionbar">
  <div class="actionbar-inner" style="display:flex; gap:8px; flex:1;">
    <button id="btnStart" class="btn primary">▶ 開始錄音</button>
    <button id="btnPause" class="btn warn" disabled>⏸ 暫停</button>
    <button id="btnStop" class="btn danger" disabled>⏹ 結束</button>
    <button id="btnExport" class="btn">⬇ 匯出</button>
  </div>
</div>

<!-- Export modal -->
<div id="exportModal" class="modal-back hide">
  <div class="modal">
    <h3>匯出會議紀錄</h3>
    <button class="opt" data-fmt="txt">📄 純文字 (.txt)</button>
    <button class="opt" data-fmt="md">📝 Markdown (.md)</button>
    <button class="opt" data-fmt="html">🌐 網頁檔 (.html)</button>
    <button class="opt" data-fmt="copy">📋 複製到剪貼簿</button>
    <button class="opt" data-fmt="clear" style="color: var(--danger);">🗑 清空所有紀錄</button>
    <button class="opt" data-fmt="cancel" style="color: var(--muted);">取消</button>
  </div>
</div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  const state = {
    recognition: null,
    isRecording: false,
    isPaused: false,
    entries: [],
    targets: new Set(['en']),
    interimEl: null,
    startTime: null,
    deferredPrompt: null,
  };

  if (!SR) {
    showWarn('您的瀏覽器不支援語音辨識。請改用 Chrome、Edge 或 iOS 14.5+ Safari。');
    $('btnStart').disabled = true;
  }

  // === Default chip selection ===
  document.querySelectorAll('#targetChips .chip').forEach(chip => {
    if (state.targets.has(chip.dataset.code)) chip.classList.add('active');
    chip.addEventListener('click', () => {
      const code = chip.dataset.code;
      if (state.targets.has(code)) {
        state.targets.delete(code);
        chip.classList.remove('active');
      } else {
        state.targets.add(code);
        chip.classList.add('active');
      }
    });
  });

  $('meetingTitle').value = `會議紀錄 ${new Date().toISOString().slice(0,10)}`;

  // === Settings toggle ===
  $('btnSettings').addEventListener('click', () => {
    $('config').classList.toggle('open');
  });

  // === Helpers ===
  function showWarn(msg) {
    const box = $('warnBox');
    box.textContent = '⚠️ ' + msg;
    box.classList.remove('hide');
  }
  function setStatus(mode) {
    const dot = $('statusDot');
    dot.classList.remove('live', 'paused');
    if (mode === 'live') dot.classList.add('live');
    else if (mode === 'paused') dot.classList.add('paused');
  }
  function timeStamp() {
    return new Date().toTimeString().slice(0,8);
  }
  function elapsedStamp() {
    if (!state.startTime) return '00:00:00';
    const ms = Date.now() - state.startTime;
    const s = Math.floor(ms/1000);
    const hh = String(Math.floor(s/3600)).padStart(2,'0');
    const mm = String(Math.floor((s%3600)/60)).padStart(2,'0');
    const ss = String(s%60).padStart(2,'0');
    return `${hh}:${mm}:${ss}`;
  }
  function ensureEmptyHidden() {
    const e = $('emptyState'); if (e) e.remove();
  }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function translate(text, srcLang, targetLang) {
    try {
      const src = srcLang.split('-')[0];
      const srcSafe = (src === 'nan') ? 'zh' : src;
      if (srcSafe === targetLang.split('-')[0] && srcSafe !== 'zh') return text;
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(srcSafe)}|${encodeURIComponent(targetLang)}`;
      const r = await fetch(url);
      const j = await r.json();
      return (j && j.responseData && j.responseData.translatedText) || '[翻譯失敗]';
    } catch (e) {
      console.error(e);
      return '[翻譯錯誤]';
    }
  }

  const LANG_LABEL = {
    'zh-TW': '繁中', 'zh-CN': '簡中', 'en': '英', 'ja': '日',
    'ko': '韓', 'es': '西', 'fr': '法', 'de': '德'
  };

  function addEntry(originalText) {
    ensureEmptyHidden();
    const entry = {
      time: timeStamp(),
      elapsed: elapsedStamp(),
      original: originalText.trim(),
      translations: {}
    };
    state.entries.push(entry);

    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `
      <div class="time">[${entry.elapsed}] ${entry.time}</div>
      <div class="original">${escapeHtml(entry.original)}</div>
      <div class="translations"></div>
    `;
    $('transcript').appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'end' });

    const trBox = div.querySelector('.translations');
    const srcLang = $('srcLang').value;
    state.targets.forEach(async (tgt) => {
      const line = document.createElement('div');
      line.className = 'tr-line';
      line.innerHTML = `<span class="lang">${LANG_LABEL[tgt]||tgt}</span><span class="tr-text">翻譯中…</span>`;
      trBox.appendChild(line);
      const result = await translate(entry.original, srcLang, tgt);
      entry.translations[tgt] = result;
      line.querySelector('.tr-text').textContent = result;
    });
  }

  function showInterim(text) {
    if (!text.trim()) {
      if (state.interimEl) { state.interimEl.remove(); state.interimEl = null; }
      return;
    }
    if (!state.interimEl) {
      state.interimEl = document.createElement('div');
      state.interimEl.className = 'interim';
      $('transcript').appendChild(state.interimEl);
    }
    state.interimEl.textContent = '… ' + text;
    state.interimEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  function clearInterim() {
    if (state.interimEl) { state.interimEl.remove(); state.interimEl = null; }
  }

  function buildRecognition() {
    const r = new SR();
    r.lang = $('srcLang').value;
    r.continuous = true;
    r.interimResults = true;

    r.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        if (res.isFinal) {
          clearInterim();
          if (res[0].transcript.trim()) addEntry(res[0].transcript);
        } else {
          interim += res[0].transcript;
        }
      }
      if (interim) showInterim(interim);
    };

    r.onerror = (e) => {
      console.warn('SR error', e);
      if (e.error === 'no-speech') return;
      if (e.error === 'language-not-supported') {
        showWarn(`此瀏覽器不支援所選語言（${r.lang}）。請改用「中文（繁體・台灣）」或英文。`);
      } else if (e.error === 'not-allowed') {
        showWarn('麥克風權限被拒絕。請至瀏覽器設定開啟麥克風權限。');
      }
    };

    r.onend = () => {
      if (state.isRecording && !state.isPaused) {
        try { r.start(); } catch(_) {}
      }
    };

    return r;
  }

  $('btnStart').addEventListener('click', () => {
    if (!SR) return;
    state.recognition = buildRecognition();
    state.isRecording = true;
    state.isPaused = false;
    state.startTime = state.startTime || Date.now();
    try { state.recognition.start(); } catch(_) {}
    setStatus('live');
    $('btnStart').disabled = true;
    $('btnPause').disabled = false;
    $('btnStop').disabled = false;
    $('config').classList.remove('open');
  });

  $('btnPause').addEventListener('click', () => {
    if (!state.recognition) return;
    if (!state.isPaused) {
      state.isPaused = true;
      try { state.recognition.stop(); } catch(_) {}
      setStatus('paused');
      $('btnPause').textContent = '▶ 繼續';
    } else {
      state.isPaused = false;
      try { state.recognition.start(); } catch(_) {}
      setStatus('live');
      $('btnPause').textContent = '⏸ 暫停';
    }
  });

  $('btnStop').addEventListener('click', () => {
    state.isRecording = false;
    state.isPaused = false;
    if (state.recognition) {
      try { state.recognition.stop(); } catch(_) {}
      state.recognition = null;
    }
    clearInterim();
    setStatus(null);
    $('btnStart').disabled = false;
    $('btnStart').textContent = '▶ 重新開始';
    $('btnPause').disabled = true;
    $('btnStop').disabled = true;
    $('btnPause').textContent = '⏸ 暫停';
  });

  // === Export modal ===
  $('btnExport').addEventListener('click', () => {
    $('exportModal').classList.remove('hide');
  });
  document.querySelectorAll('#exportModal .opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const fmt = btn.dataset.fmt;
      $('exportModal').classList.add('hide');
      if (fmt === 'cancel') return;
      if (fmt === 'clear') return doClear();
      if (fmt === 'copy') return doCopy();
      doExport(fmt);
    });
  });

  function safeTitle() {
    return ($('meetingTitle').value || 'meeting').replace(/[^\w一-龥\-]/g,'_');
  }
  function buildText(format) {
    const title = $('meetingTitle').value || '會議紀錄';
    const date = new Date().toLocaleString();
    const targets = [...state.targets].map(c=>LANG_LABEL[c]||c).join('、');
    if (format === 'md') {
      let out = `# ${title}\n\n`;
      out += `**日期**：${date}  \n**語音語言**：${$('srcLang').value}  \n**翻譯語言**：${targets}\n\n---\n\n`;
      state.entries.forEach(e => {
        out += `### [${e.elapsed}] ${e.time}\n\n**原文**：${e.original}\n\n`;
        Object.entries(e.translations).forEach(([k,v]) => out += `- **${LANG_LABEL[k]||k}**：${v}\n`);
        out += `\n`;
      });
      return out;
    }
    if (format === 'html') {
      let body = `<h1>${title}</h1><p><b>日期：</b>${date}<br><b>語音語言：</b>${$('srcLang').value}<br><b>翻譯語言：</b>${targets}</p><hr>`;
      state.entries.forEach(e => {
        body += `<div style="margin-bottom:16px;padding:10px;border-left:3px solid #38bdf8;background:#f1f5f9;">`;
        body += `<div style="font-size:11px;color:#64748b;font-family:monospace">[${e.elapsed}] ${e.time}</div>`;
        body += `<div style="font-size:16px;margin:6px 0">${escapeHtml(e.original)}</div>`;
        Object.entries(e.translations).forEach(([k,v]) =>
          body += `<div style="font-size:14px;color:#475569"><b>${LANG_LABEL[k]||k}：</b>${escapeHtml(v)}</div>`);
        body += `</div>`;
      });
      return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${title}</title><style>body{font-family:-apple-system,sans-serif;max-width:780px;margin:40px auto;padding:0 16px;color:#0f172a}</style></head><body>${body}</body></html>`;
    }
    let out = `${title}\n日期：${date}\n語音語言：${$('srcLang').value}\n翻譯語言：${targets}\n${'='.repeat(60)}\n\n`;
    state.entries.forEach(e => {
      out += `[${e.elapsed}] ${e.time}\n原文：${e.original}\n`;
      Object.entries(e.translations).forEach(([k,v]) => out += `${LANG_LABEL[k]||k}：${v}\n`);
      out += `\n`;
    });
    return out;
  }
  function doExport(fmt) {
    if (!state.entries.length) { alert('還沒有任何紀錄可以匯出'); return; }
    const content = buildText(fmt);
    const mime = fmt === 'html' ? 'text/html' : 'text/plain';
    const blob = new Blob([content], { type: `${mime};charset=utf-8` });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${safeTitle()}.${fmt}`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  async function doCopy() {
    if (!state.entries.length) { alert('還沒有任何紀錄'); return; }
    try {
      await navigator.clipboard.writeText(buildText('txt'));
      alert('✓ 已複製到剪貼簿');
    } catch(e) { alert('複製失敗：' + e.message); }
  }
  function doClear() {
    if (state.entries.length && !confirm('確定清空所有紀錄？')) return;
    state.entries = [];
    state.startTime = null;
    document.querySelectorAll('#transcript .entry, #transcript .interim').forEach(n => n.remove());
    if (!$('emptyState')) {
      const e = document.createElement('div');
      e.id = 'emptyState'; e.className = 'empty';
      e.innerHTML = '<div class="icon-big">🎤</div><h2>已清空</h2><p>點下方「開始錄音」重新開始。</p>';
      $('transcript').appendChild(e);
    }
  }

  $('srcLang').addEventListener('change', () => {
    if (state.recognition) {
      state.recognition.lang = $('srcLang').value;
      try { state.recognition.stop(); } catch(_) {}
    }
  });

  // === PWA install prompt ===
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    state.deferredPrompt = e;
    $('installBanner').classList.remove('hide');
  });
  $('btnInstall').addEventListener('click', async () => {
    if (!state.deferredPrompt) return;
    state.deferredPrompt.prompt();
    await state.deferredPrompt.userChoice;
    state.deferredPrompt = null;
    $('installBanner').classList.add('hide');
  });
  $('btnInstallClose').addEventListener('click', () => {
    $('installBanner').classList.add('hide');
  });

  // === Service worker ===
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW reg failed', err));
    });
  }

  // === Wake lock to prevent screen sleeping during recording ===
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch(_) {}
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(()=>{}); wakeLock = null; }
  }
  $('btnStart').addEventListener('click', requestWakeLock);
  $('btnStop').addEventListener('click', releaseWakeLock);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.isRecording) requestWakeLock();
  });
})();
</script>
</body>
</html>
